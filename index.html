<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141a8c" />
    <meta name="description" content="Zion, la cité des veilleurs : un jeu 3D gratuit et accessible où des histoires de la Bible font découvrir le caractère de Jésus." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Zion — La cité des veilleurs</title>
  </head>
  <body>
    <!-- La scène 3D est purement décorative pour les lecteurs d'écran :
         toute l'information utile est aussi donnée en HTML. -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="fade" class="fade" aria-hidden="true"></div>
    <div id="loading" class="loading" role="status" hidden>
      <p class="loading-text"><span data-i18n="loading.text"></span> <span id="loading-pct">0</span> %</p>
      <div class="loading-bar" aria-hidden="true"><span id="loading-fill"></span></div>
    </div>
    <div id="souvenir-frame" class="souvenir-frame" hidden aria-hidden="true"></div>

    <main id="app">
      <!-- ============ Écran titre ============ -->
      <section id="screen-title" class="screen screen-title" aria-labelledby="title-heading">
        <div class="title-bg" aria-hidden="true">
          <div class="stars"></div>
          <div class="moon"></div>
          <svg class="flying-dove" viewBox="0 0 100 70">
            <!-- Colombe de la paix avec un rameau d'olivier (clin d'œil à Noé) -->
            <!-- Aile arrière, un peu plus grise, battement décalé -->
            <path class="wing wing-back" fill="#dfe3f7" d="M54,38 C52,26 46,15 34,8 C37,14 36,17 31,17 C36,21 35,24 30,25 C35,28 36,32 40,40 Z" />
            <!-- Queue en éventail, avec des plumes -->
            <path fill="#eef0fb" d="M32,45 L10,37 L15,43 L6,47 L15,50 L9,58 L20,54 L18,61 L34,51 Z" />
            <!-- Corps dodu -->
            <path fill="#ffffff" d="M28,46 C33,36 47,31 62,32 C71,33 77,36 80,41 C78,47 70,52 59,53 C46,55 34,53 28,46 Z" />
            <!-- Tête ronde -->
            <circle cx="79" cy="34" r="7.5" fill="#ffffff" />
            <!-- Rameau d'olivier -->
            <path d="M88,37 C91,41 94,44 99,46" fill="none" stroke="#5b7a2a" stroke-width="1.6" stroke-linecap="round" />
            <ellipse cx="93" cy="44" rx="3.6" ry="1.6" fill="#7cb342" transform="rotate(35 93 44)" />
            <ellipse cx="96.5" cy="42" rx="3.2" ry="1.4" fill="#8bc34a" transform="rotate(-20 96.5 42)" />
            <ellipse cx="98" cy="48" rx="3" ry="1.3" fill="#7cb342" transform="rotate(50 98 48)" />
            <!-- Bec et œil -->
            <path fill="#f2a705" d="M85.5,33 L92,35.5 L85.5,37.5 Z" />
            <circle cx="81.5" cy="32" r="1.4" fill="#14123a" />
            <!-- Aile avant, grande, plumes découpées -->
            <path class="wing wing-front" fill="#ffffff" d="M62,39 C60,24 52,11 36,2 C40,9 38,12 32,12 C38,16 36,19 30,19 C36,23 34,26 29,27 C36,30 40,33 44,41 C50,44 57,43 62,39 Z" />
          </svg>
          <!-- Silhouette de Zion : collines, remparts, maisons et la tour du Gardien avec sa lumière. -->
          <svg class="skyline" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice">
            <path class="hill hill-back" d="M0,250 C200,180 380,230 600,190 C820,150 1000,210 1200,170 L1200,400 L0,400 Z" />
            <g class="city">
              <rect x="180" y="250" width="840" height="150" />
              <g class="crenels">
                <rect x="180" y="238" width="22" height="14" /><rect x="230" y="238" width="22" height="14" /><rect x="280" y="238" width="22" height="14" />
                <rect x="330" y="238" width="22" height="14" /><rect x="380" y="238" width="22" height="14" /><rect x="430" y="238" width="22" height="14" />
                <rect x="760" y="238" width="22" height="14" /><rect x="810" y="238" width="22" height="14" /><rect x="860" y="238" width="22" height="14" />
                <rect x="910" y="238" width="22" height="14" /><rect x="960" y="238" width="22" height="14" /><rect x="998" y="238" width="22" height="14" />
              </g>
              <rect x="300" y="200" width="90" height="60" /><rect x="410" y="185" width="70" height="75" /><rect x="700" y="195" width="80" height="65" /><rect x="800" y="180" width="95" height="80" />
              <rect x="545" y="70" width="110" height="200" rx="6" />
              <g class="tower-top"><rect x="535" y="58" width="22" height="18" /><rect x="567" y="58" width="22" height="18" /><rect x="600" y="58" width="22" height="18" /><rect x="633" y="58" width="22" height="18" /></g>
            </g>
            <g class="windows">
              <rect x="330" y="220" width="10" height="14" /><rect x="440" y="205" width="10" height="14" /><rect x="725" y="215" width="10" height="14" /><rect x="840" y="200" width="12" height="16" />
              <rect x="592" y="120" width="16" height="26" rx="8" />
            </g>
            <circle class="beacon" cx="600" cy="44" r="16" />
            <path class="hill hill-front" d="M0,330 C260,290 420,350 640,320 C860,290 1020,340 1200,310 L1200,400 L0,400 Z" />
          </svg>
        </div>
        <div class="title-content">
          <h1 id="title-heading" class="logo" aria-label="Zion">
            <span aria-hidden="true">Z</span><span aria-hidden="true">I</span><span aria-hidden="true">O</span><span aria-hidden="true">N</span>
          </h1>
          <svg class="ornament" viewBox="0 0 320 40" aria-hidden="true">
            <path d="M10,20 C60,20 80,6 120,14 C140,18 148,26 160,20 C172,26 180,18 200,14 C240,6 260,20 310,20" />
            <path d="M160,8 L168,20 L160,32 L152,20 Z" class="ornament-gem" />
          </svg>
          <p class="logo-sub" data-i18n="app.subtitle"></p>
          <p class="tagline" data-i18n="app.tagline"></p>
          <div class="title-actions">
            <button id="btn-start" class="btn btn-primary btn-xl" data-i18n="title.start"></button>
            <button id="btn-title-settings" class="btn btn-light" data-i18n="title.settings"></button>
            <button id="btn-title-help" class="btn btn-light" data-i18n="title.help"></button>
          </div>
          <div class="lang-switch" role="group" data-i18n-aria="title.language"></div>
        </div>
      </section>

      <!-- ============ Premier lancement : préférences ============ -->
      <section id="screen-setup" class="screen screen-setup" hidden aria-labelledby="setup-heading">
        <div class="panel">
          <h2 id="setup-heading" tabindex="-1" data-i18n="setup.heading"></h2>
          <p data-i18n="setup.intro"></p>
          <div class="setup-grid">
            <button class="toggle-card" data-setting="readAloud" aria-pressed="false">
              <span class="toggle-icon" aria-hidden="true">🔊</span><span data-i18n="setup.readAloud"></span>
            </button>
            <button class="toggle-card" data-setting="bigText" aria-pressed="false">
              <span class="toggle-icon" aria-hidden="true">🔠</span><span data-i18n="setup.bigText"></span>
            </button>
            <button class="toggle-card" data-setting="highContrast" aria-pressed="false">
              <span class="toggle-icon" aria-hidden="true">◐</span><span data-i18n="setup.contrast"></span>
            </button>
            <button class="toggle-card" data-setting="reduceMotion" aria-pressed="false">
              <span class="toggle-icon" aria-hidden="true">🐢</span><span data-i18n="setup.calm"></span>
            </button>
          </div>
          <button id="btn-setup-go" class="btn btn-primary btn-xl" data-i18n="setup.go"></button>
        </div>
      </section>

      <!-- ============ Choix des missions ============ -->
      <section id="screen-stories" class="screen screen-stories" hidden aria-labelledby="stories-heading">
        <header class="stories-header">
          <span class="header-actions">
            <button id="btn-stories-back" class="btn btn-light btn-small" data-i18n="stories.back"></button>
            <button id="btn-journal" class="btn btn-light btn-small"><span aria-hidden="true">📔</span> <span data-i18n="journal.button"></span></button>
          </span>
          <span class="header-actions">
            <button id="btn-songs" class="btn btn-light btn-small" aria-pressed="false"><span aria-hidden="true">♪</span> <span data-i18n="songs.button"></span></button>
            <button id="btn-stories-settings" class="btn btn-light btn-small" data-i18n="title.settings"></button>
          </span>
        </header>
        <h2 id="stories-heading" tabindex="-1" class="kinetic" data-i18n="stories.heading"></h2>
        <p class="stories-intro" data-i18n="stories.intro"></p>
        <!-- Le Gardien demande des nouvelles du défi de la semaine -->
        <div id="followup" class="followup page" hidden role="region" aria-live="polite"></div>
        <p class="stories-progress" aria-live="polite"><span id="stories-count" class="counter">0</span> <span id="stories-progress-text"></span></p>
        <ul id="story-list" class="story-list"></ul>
        <h3 class="traits-heading" data-i18n="stories.traits"></h3>
        <ul id="trait-list" class="trait-list"></ul>
      </section>

      <!-- ============ En jeu ============ -->
      <section id="screen-game" class="screen screen-game" hidden aria-label="Zion">
        <div class="hud-top">
          <div class="objective page" id="objective" hidden>
            <span class="objective-label" data-i18n="hud.objective"></span>
            <span id="souvenir-label" class="souvenir-label" hidden></span>
            <span id="objective-text"></span>
            <span id="counter" class="counter-pill" hidden></span>
          </div>
          <div class="hud-buttons">
            <button id="btn-where" class="btn btn-hud"><span aria-hidden="true">🧭</span> <span data-i18n="hud.where"></span></button>
            <button id="btn-guide" class="btn btn-hud" aria-pressed="false"><span aria-hidden="true">👣</span> <span id="guide-label" data-i18n="hud.guide"></span></button>
            <button id="btn-songs-hud" class="btn btn-hud btn-icon" data-i18n-aria="songs.open"><span aria-hidden="true">♪</span></button>
            <button id="btn-pause" class="btn btn-hud btn-icon" data-i18n-aria="hud.menu"><span aria-hidden="true">☰</span></button>
          </div>
          <!-- Sous-titres des sons : dans le flux du HUD, ils se placent toujours juste en dessous. -->
          <div id="captions" class="captions" aria-hidden="true"></div>
        </div>
        <div id="toast" class="toast" aria-hidden="true"></div>

        <button id="btn-action" class="action-btn" hidden></button>
        <div id="joystick" class="joystick" aria-hidden="true"><div class="knob"></div></div>

        <div id="dialog" class="dialogbox page" hidden role="region" data-i18n-aria="dialog.region">
          <div class="dialog-speaker"><span id="dialog-badge" class="dialog-badge" aria-hidden="true"></span><span id="dialog-name"></span></div>
          <p id="dialog-text" class="dialog-text" aria-live="polite"></p>
          <div class="dialog-actions">
            <button id="dialog-replay" class="btn btn-light btn-small"><span aria-hidden="true">🔊</span> <span data-i18n="dialog.replay"></span></button>
            <button id="dialog-next" class="btn btn-primary"><span id="dialog-next-label" data-i18n="dialog.next"></span> <span aria-hidden="true">▶</span></button>
          </div>
        </div>
      </section>

      <!-- ============ Carnet du veilleur ============ -->
      <section id="screen-journal" class="screen screen-stories" hidden aria-labelledby="journal-heading">
        <header class="stories-header">
          <button id="btn-journal-back" class="btn btn-light btn-small" data-i18n="stories.back"></button>
        </header>
        <h2 id="journal-heading" tabindex="-1" data-i18n="journal.heading"></h2>
        <p class="stories-intro" data-i18n="journal.intro"></p>
        <ul id="journal-list" class="journal-list"></ul>
        <h3 class="traits-heading" data-i18n="journal.verses"></h3>
        <ul id="journal-verses" class="journal-verses"></ul>
      </section>

      <!-- ============ Fin de mission ============ -->
      <section id="screen-end" class="screen screen-end" hidden aria-labelledby="end-heading">
        <div class="end-card page">
          <svg class="end-star" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L62 38 L96 38 L68 58 L79 92 L50 71 L21 92 L32 58 L4 38 L38 38 Z" />
          </svg>
          <h2 id="end-heading" tabindex="-1" class="kinetic" data-i18n="end.bravo"></h2>
          <p class="end-mission" id="end-mission"></p>
          <div class="end-trait" id="end-trait"></div>
          <h3 data-i18n="end.message"></h3>
          <p id="end-message"></p>
          <h3 data-i18n="end.reference"></h3>
          <p id="end-reference" class="end-reference"></p>
          <div class="reflection">
            <h3 data-i18n="end.reflection"></h3>
            <p id="end-reflection"></p>
          </div>
          <!-- Prolonger la mission dans la vraie vie (rempli par ui/Life.ts) -->
          <div id="end-life" class="life" hidden></div>
          <div class="end-actions">
            <button id="btn-end-back" class="btn btn-primary btn-xl" data-i18n="end.back"></button>
            <button id="btn-end-replay" class="btn btn-light" data-i18n="end.replay"></button>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ Parchemin (récit biblique) ============ -->
    <div id="scroll" class="overlay scroll-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="scroll-title">
      <div class="scroll-paper page">
        <p id="scroll-ref" class="scroll-ref"></p>
        <h2 id="scroll-title" tabindex="-1"></h2>
        <div class="scroll-stage">
          <div id="scroll-icon" class="scroll-icon" aria-hidden="true"></div>
          <p id="scroll-text" class="scroll-text" aria-live="polite"></p>
        </div>
        <p id="scroll-count" class="scroll-count"></p>
        <div class="scroll-actions">
          <button id="scroll-prev" class="btn btn-light"><span aria-hidden="true">◀</span> <span data-i18n="scroll.prev"></span></button>
          <button id="scroll-replay" class="btn btn-light btn-small"><span aria-hidden="true">🔊</span> <span data-i18n="dialog.replay"></span></button>
          <button id="scroll-next" class="btn btn-primary"><span id="scroll-next-label" data-i18n="scroll.next"></span> <span aria-hidden="true">▶</span></button>
        </div>
      </div>
    </div>

    <!-- ============ Carte du trait du Christ ============ -->
    <div id="trait" class="overlay trait-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="trait-name">
      <div class="trait-card page">
        <p class="trait-kicker" data-i18n="trait.heading"></p>
        <div id="trait-icon" class="trait-icon" aria-hidden="true"></div>
        <h2 id="trait-name" tabindex="-1" class="kinetic"></h2>
        <p id="trait-desc" class="trait-desc"></p>
        <div class="trait-jesus">
          <h3 data-i18n="trait.jesus"></h3>
          <p id="trait-jesus"></p>
          <p id="trait-ref" class="trait-ref"></p>
        </div>
        <button id="trait-continue" class="btn btn-primary btn-xl" data-i18n="trait.continue"></button>
      </div>
    </div>

    <!-- ============ Pause ============ -->
    <dialog id="dlg-pause" class="modal page" aria-labelledby="pause-heading">
      <h2 id="pause-heading" data-i18n="pause.heading"></h2>
      <div class="menu-list">
        <button id="btn-resume" class="btn btn-primary" data-i18n="pause.resume"></button>
        <button id="btn-pause-settings" class="btn btn-light" data-i18n="pause.settings"></button>
        <button id="btn-pause-help" class="btn btn-light" data-i18n="pause.help"></button>
        <button id="btn-restart" class="btn btn-light" data-i18n="pause.restart"></button>
        <button id="btn-quit" class="btn btn-light" data-i18n="pause.quit"></button>
      </div>
    </dialog>

    <!-- ============ Réglages ============ -->
    <dialog id="dlg-settings" class="modal modal-wide page" aria-labelledby="settings-heading">
      <form method="dialog" id="settings-form">
        <div class="modal-head">
          <h2 id="settings-heading" data-i18n="settings.heading"></h2>
          <button class="btn btn-light btn-small" value="close" data-i18n="settings.close"></button>
        </div>

        <fieldset>
          <legend data-i18n="settings.language"></legend>
          <label class="field"><span data-i18n="settings.language"></span><select name="lang" id="set-lang"></select></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.reading"></legend>
          <label class="switch"><input type="checkbox" role="switch" name="readAloud" /><span data-i18n="settings.readAloud"></span></label>
          <div class="radio-row" role="radiogroup" aria-labelledby="rate-label">
            <span id="rate-label" data-i18n="settings.rate"></span>
            <label><input type="radio" name="speechRate" value="0.8" /><span data-i18n="settings.slow"></span></label>
            <label><input type="radio" name="speechRate" value="1" /><span data-i18n="settings.normal"></span></label>
            <label><input type="radio" name="speechRate" value="1.2" /><span data-i18n="settings.fast"></span></label>
          </div>
          <label class="field"><span data-i18n="settings.voice"></span><select name="voice" id="set-voice"></select></label>
          <p class="note" data-i18n="settings.voiceTip"></p>
          <label class="switch"><input type="checkbox" role="switch" name="autoAdvance" /><span data-i18n="settings.autoAdvance"></span></label>
          <button type="button" id="btn-test-voice" class="btn btn-light btn-small" data-i18n="settings.testVoice"></button>
          <p id="no-voice" class="note" hidden data-i18n="settings.noVoice"></p>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.display"></legend>
          <div class="radio-row" role="radiogroup" aria-labelledby="size-label">
            <span id="size-label" data-i18n="settings.textSize"></span>
            <label><input type="radio" name="textSize" value="m" /><span data-i18n="settings.sizeM"></span></label>
            <label><input type="radio" name="textSize" value="l" /><span data-i18n="settings.sizeL"></span></label>
            <label><input type="radio" name="textSize" value="xl" /><span data-i18n="settings.sizeXL"></span></label>
          </div>
          <label class="switch"><input type="checkbox" role="switch" name="highContrast" /><span data-i18n="settings.contrast"></span></label>
          <label class="switch"><input type="checkbox" role="switch" name="reduceMotion" /><span data-i18n="settings.calm"></span></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.sound"></legend>
          <label class="switch"><input type="checkbox" role="switch" name="music" /><span data-i18n="settings.music"></span></label>
          <div class="radio-row" role="radiogroup" aria-labelledby="music-label">
            <span id="music-label" data-i18n="settings.musicVolume"></span>
            <label><input type="radio" name="musicVolume" value="0.15" /><span data-i18n="settings.soft"></span></label>
            <label><input type="radio" name="musicVolume" value="0.3" /><span data-i18n="settings.medium"></span></label>
            <label><input type="radio" name="musicVolume" value="0.5" /><span data-i18n="settings.loud"></span></label>
          </div>
          <label class="switch"><input type="checkbox" role="switch" name="sfx" /><span data-i18n="settings.sfx"></span></label>
          <label class="switch"><input type="checkbox" role="switch" name="beacon" /><span data-i18n="settings.beacon"></span></label>
          <label class="switch"><input type="checkbox" role="switch" name="captions" /><span data-i18n="settings.captions"></span></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.performance"></legend>
          <label class="switch"><input type="checkbox" role="switch" name="lowQuality" /><span data-i18n="settings.lowQuality"></span></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="settings.data"></legend>
          <p class="note" data-i18n="settings.dataInfo"></p>
          <button type="button" id="btn-reset" class="btn btn-danger btn-small" data-i18n="settings.reset"></button>
        </fieldset>
      </form>
    </dialog>

    <!-- ============ Aide ============ -->
    <dialog id="dlg-help" class="modal modal-wide page" aria-labelledby="help-heading">
      <div class="modal-head">
        <h2 id="help-heading" data-i18n="help.heading"></h2>
        <button class="btn btn-light btn-small" data-close data-i18n="help.close"></button>
      </div>
      <table class="help-table">
        <thead>
          <tr><th scope="col"></th><th scope="col" data-i18n="help.keyboard"></th><th scope="col" data-i18n="help.touch"></th></tr>
        </thead>
        <tbody>
          <tr><th scope="row" data-i18n="help.move"></th><td data-i18n="help.moveKeys"></td><td data-i18n="help.moveTouch"></td></tr>
          <tr><th scope="row" data-i18n="help.action"></th><td data-i18n="help.actionKeys"></td><td data-i18n="help.actionTouch"></td></tr>
          <tr><th scope="row" data-i18n="help.where"></th><td data-i18n="help.whereKeys"></td><td data-i18n="help.whereTouch"></td></tr>
          <tr><th scope="row" data-i18n="help.guide"></th><td data-i18n="help.guideKeys"></td><td data-i18n="help.guideTouch"></td></tr>
          <tr><th scope="row" data-i18n="help.menu"></th><td data-i18n="help.menuKeys"></td><td data-i18n="help.menuTouch"></td></tr>
        </tbody>
      </table>
      <p class="note" data-i18n="help.tip"></p>
      <h3 data-i18n="help.credits"></h3>
      <p class="note" data-i18n="help.creditsText"></p>
    </dialog>

    <!-- ============ Jeu du verset ============ -->
    <dialog id="dlg-verse" class="modal modal-wide page" aria-labelledby="verse-heading">
      <div class="modal-head">
        <h2 id="verse-heading" data-i18n="life.verseGame"></h2>
        <button id="verse-close" class="btn btn-light btn-small" data-i18n="settings.close"></button>
      </div>
      <p id="verse-ref" class="life-ref"></p>
      <p id="verse-built" class="verse-built" aria-live="polite"></p>
      <div id="verse-pool" class="verse-pool"></div>
      <p id="verse-status" class="note" aria-live="polite"></p>
      <button id="verse-listen" class="btn btn-light btn-small"><span aria-hidden="true">🔊</span> <span data-i18n="life.listenVerse"></span></button>
    </dialog>

    <!-- ============ Guide parents & moniteurs ============ -->
    <dialog id="dlg-guide" class="modal modal-wide page" aria-labelledby="guide-title">
      <div class="modal-head">
        <h2 id="guide-title"></h2>
        <span class="header-actions">
          <button id="guide-print" class="btn btn-light btn-small" data-i18n="guide.print"></button>
          <button id="guide-close" class="btn btn-light btn-small" data-i18n="settings.close"></button>
        </span>
      </div>
      <p class="note" data-i18n="guide.intro"></p>
      <div id="guide-body" class="guide-body"></div>
    </dialog>

    <!-- ============ Lecteur de chants (dossier sounds/) ============ -->
    <section id="music-player" class="music-player page" hidden aria-labelledby="mp-heading">
      <div class="modal-head">
        <h2 id="mp-heading" data-i18n="songs.heading"></h2>
        <button id="mp-close" class="btn btn-light btn-small" data-i18n="songs.close"></button>
      </div>
      <p id="mp-title" class="mp-title" aria-live="polite"></p>
      <p id="mp-status" class="note"></p>
      <input id="mp-seek" class="mp-seek" type="range" min="0" max="1000" value="0" data-i18n-aria="songs.seek" />
      <p id="mp-time" class="mp-time">0:00 / 0:00</p>
      <div class="mp-controls">
        <button id="mp-prev" class="btn btn-light btn-icon" data-i18n-aria="songs.prev"><span aria-hidden="true">⏮</span></button>
        <button id="mp-back" class="btn btn-light btn-icon" data-i18n-aria="songs.back"><span aria-hidden="true">↺10</span></button>
        <button id="mp-play" class="btn btn-primary btn-icon mp-play">▶</button>
        <button id="mp-fwd" class="btn btn-light btn-icon" data-i18n-aria="songs.forward"><span aria-hidden="true">10↻</span></button>
        <button id="mp-next" class="btn btn-light btn-icon" data-i18n-aria="songs.next"><span aria-hidden="true">⏭</span></button>
      </div>
      <label class="field mp-volume"><span data-i18n="songs.volume"></span><input id="mp-volume" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
      <ul id="mp-list" class="mp-list" data-i18n-aria="songs.list"></ul>
    </section>

    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript><p style="padding:2rem;font-size:1.4rem">Zion a besoin de JavaScript pour fonctionner.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
